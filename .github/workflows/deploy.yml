name: DevOpsProject – Deploy BookStack naar AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- TERRAFORM ----------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_public_key_path: /tmp/id_rsa.pub
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/id_rsa.pub
          terraform apply -auto-approve

      - name: Haal publiek IP-adres op
        working-directory: terraform
        run: echo "BOOKSTACK_IP=$(terraform output -raw bookstack_public_ip)" >> "$GITHUB_ENV"

      # ---------- SSH VOORBEREIDEN ----------
      - name: SSH-key klaarzetten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wacht tot SSH beschikbaar is op de nieuwe server
        run: |
          for i in $(seq 1 30); do
            nc -z -w5 "$BOOKSTACK_IP" 22 && echo "SSH is bereikbaar" && break
            echo "Wachten op SSH... ($i/30)"
            sleep 10
          done

      # ---------- ANSIBLE ----------
      - name: Genereer Ansible inventory
        run: |
          echo "[bookstack]" > ansible/inventory.ini
          echo "$BOOKSTACK_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini

      - name: Installeer Ansible
        run: pip install ansible

      - name: Voer Ansible playbook uit
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook playbook.yml \
            --extra-vars "bookstack_db_root_password=${{ secrets.BOOKSTACK_DB_ROOT_PASSWORD }}" \
            --extra-vars "bookstack_db_password=${{ secrets.BOOKSTACK_DB_PASSWORD }}" \
            --extra-vars "bookstack_app_key=${{ secrets.BOOKSTACK_APP_KEY }}" \
            --extra-vars "netdata_claim_token=${{ secrets.NETDATA_CLAIM_TOKEN }}" \
            --extra-vars "netdata_claim_room=${{ secrets.NETDATA_CLAIM_ROOM }}"

      - name: Toon eindresultaat
        run: |
          echo "BookStack is beschikbaar op: http://$BOOKSTACK_IP"